name: Reliability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            05_web_app/package-lock.json
            06_backend/package-lock.json
      - run: npm ci
        working-directory: 05_web_app
      - run: npm ci
        working-directory: 06_backend
      - run: npm test
        working-directory: 05_web_app
      - run: npm run build
        working-directory: 05_web_app
      - run: npm run typecheck
        working-directory: 06_backend
      - run: npm test
        working-directory: 06_backend
